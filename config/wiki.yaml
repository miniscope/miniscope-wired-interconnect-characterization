# MediaWiki publishing configuration (no secrets here -- bot credentials
# come from the MEDIAWIKI_BOT_USER / MEDIAWIKI_BOT_PASSWORD environment
# variables, set as GitHub Actions secrets).

api_url: "https://miniscope.org/api.php"

# Main user-facing resource page (non-technical audience).
main_page: "Coax_cable_characterization"

# Per-profile detail pages; {profile_id} is substituted.
profile_page_template: "Coax_cable_characterization/{profile_id}"

# Prefix for uploaded plot images to avoid filename collisions on the wiki.
image_prefix: "CoaxCableChar_"
