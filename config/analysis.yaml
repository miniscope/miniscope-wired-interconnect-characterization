# Analysis configuration: quality-score weights, zone thresholds, and
# reference parameters. Values here are intentionally easy to change
# without touching code.
#
# TODO (deferred decision -- Daniel): finalize the quality-score formula,
# weights, and zone thresholds once real measurements exist. The current
# values are placeholders so the plumbing can be exercised end to end.

quality_score:
  # Weighted combination of normalized metric scores in [0, 1].
  # Inputs are documented in src/analysis/quality_score.py.
  weights:
    eye_area: 0.4
    link_margin: 0.4
    attenuation: 0.2
  # Normalization references for the sub-scores (see src/analysis/config.py).
  references:
    # An eye never fills its bounding box: a wide-open, healthy eye occupies
    # only ~0.2-0.3 of the EOM phase x voltage scan window. This is the eye-area
    # ratio that maps to a perfect eye sub-score of 1.0; ratios above it
    # saturate. Without it the eye term (weight 0.4) is structurally capped near
    # 0.1 and NO cable can reach the "works" zone.
    eye_area_full_scale: 0.25
    # The forward link's TX start amplitude (registers.SER_TX_START_MV = 410):
    # a margin floor sitting at full drive means zero headroom -> sub-score 0.
    # (The reverse link starts lower at 250 mV, so its margin is mildly
    # over-credited against this single scale -- acceptable; reverse is the slow,
    # robust channel.)
    link_margin_full_scale_mv: 410.0
    attenuation_full_scale_db: 20.0

# Zones for the user-facing quality-vs-length plot.
# score >= works            -> "should just work"
# score >= marginal         -> "may have issues"
# score <  marginal         -> "not recommended"
zones:
  # A clean cable on a healthy link tops out around 0.8 with the normalized
  # sub-scores, so "works" sits just below that rather than demanding a
  # near-perfect 0.8+ on every metric at once.
  works: 0.75
  marginal: 0.5

# Reference supply voltage for reporting (the USB 5 V rail). How a DAQ is
# powered is a user-side choice -- DAQs can also take an adjustable input --
# so this is an analysis/reporting convention, NOT a property of any
# miniscope model. It sets the marked line on the supply-window plots and
# the "max usable length at the reference supply" summary.
reference_supply_v: 5.0

# SerDes data rates characterized (Gbps).
serdes_rates_gbps: [3, 6]

# Frequencies at which scalar attenuation metrics are reported.
vna_reference_frequencies_hz: [1.0e6, 10.0e6, 100.0e6, 1.0e9]
