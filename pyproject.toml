[tool.poetry]
name = "miniscope-wired-interconnect-characterization"
description = "Characterization data, processing, and analysis for Miniscope wired interconnects"
version = "0.1.0"
authors = ["Daniel Aharoni"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"
pyyaml = "^6.0"
numpy = ">=1.26"
pandas = "^2.1"
matplotlib = "^3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.3"
pytest-cov = "^4.1"

# Acquisition app (GUI). Optional so the analysis/CI install stays lean:
#   poetry install --with acquire
[tool.poetry.group.acquire]
optional = true

[tool.poetry.group.acquire.dependencies]
nicegui = "^2"
# Serial link to the Raspberry Pi Pico GMSL2 bridge (real SerDes driver).
pyserial = "^3.5"

# Wiki publishing (CI publish job only):
#   poetry install --with publish
[tool.poetry.group.publish]
optional = true

[tool.poetry.group.publish.dependencies]
mwclient = "^0.11"

# Real-instrument dependencies (bench PC only).
#
# VNA: the PicoVNA 5 Python API uses the `vna` PyPI package PLUS platform
# native libraries that ship with the SDK download (not on PyPI), so it is
# installed manually rather than via a poetry group:
#   pip install vna   # then copy _vna_python.*, libvna.*, libftd2xx.* onto
#                     # the library path -- see src/instruments/vna/real.py
# Develop with no hardware via RealPicoVnaDriver(demo=True).
#
# SerDes: the real driver (src/instruments/serdes/real.py) drives a MAX96717/
# MAX96716A GMSL2 pair over a Raspberry Pi Pico serial bridge (firmware/
# gmsl2-bridge/). Its only extra dependency is `pyserial`, in the acquire
# group above. Develop with no hardware via RealSerdesDriver(demo=True).

[tool.poetry.scripts]
miniscope-char = "src.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "acquire: tests that require the optional acquire (GUI) dependency group",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
