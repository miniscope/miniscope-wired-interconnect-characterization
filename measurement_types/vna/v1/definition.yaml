name: vna
version: 1
description: >
  Vector Network Analyzer (VNA) characterization of cable RF performance.
  Captures S-parameters (S11, S21, etc.) across a frequency range as
  Touchstone .s2p files (PicoVNA or equivalent). The analysis pipeline
  derives attenuation vs frequency and characteristic impedance.
  The cable profile and length come from the session's location in the
  measurements/ tree.

fields:
  - name: vna_instrument
    field_type: string
    required: true
    description: VNA instrument model (e.g. "PicoVNA 106")

  - name: calibration_type
    field_type: enum
    required: true
    enum_values: ["SOLT", "TRL", "electronic_cal", "other"]
    description: VNA calibration method used

  - name: port_impedance_ohm
    field_type: float
    required: false
    default: 50.0
    description: Reference impedance in ohms

files:
  - name: manifest_csv
    filename_pattern: "manifest.csv"
    file_format: csv
    required: true
    description: >
      CSV manifest with columns: filename (required, path relative to raw/),
      [description], [notes]. Cable length is NOT a column; it comes from
      the session folder.

  - name: s_parameter_files
    filename_pattern: "raw/*.s2p"
    file_format: s2p
    required: true
    description: >
      Touchstone .s2p files with 2-port S-parameter data. Frequency range
      and number of points are extracted from the file automatically.

processing_steps:
  - name: process_vna
    processor: src.processing.vna.ProcessVNA
    description: Parse Touchstone files, extract S-parameters, compute attenuation
    outputs: ["vna_metrics_csv", "vna_traces_csv", "vna_summary_json"]

aggregation:
  - name: vna_summary
    aggregator: src.aggregation.vna.VNASummary
    description: Aggregate VNA results across sessions
    outputs: ["vna_comparison_table", "vna_overlay_plot", "vna_impedance_plot"]
