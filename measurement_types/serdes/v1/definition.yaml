name: serdes
version: 1
description: >
  GMSL2 serializer/deserializer (SerDes) signal-integrity characterization.
  Covers three lanes: the forward link (serializer -> deserializer) at 3 Gbps
  and 6 Gbps, and the fixed low-rate (~187.5 Mbps) reverse control channel.
  For each lane the acquisition captures the deserializer's eye-on-monitor
  (EOM) grid (raw hit/error counts over phase x voltage x polarity) and a
  link-margin sweep (decode errors vs TX amplitude). Raw instrument output is
  stored as-is; physical eye openings and link-margin floors are derived in
  processing. The cable profile and length come from the session's location in
  the measurements/ tree.

fields:
  - name: serdes_device
    field_type: string
    required: true
    description: SerDes pair used (e.g. "MAX96717/MAX96716A GMSL2 dev kit")

  - name: temperature_c
    field_type: float
    required: false
    default: 25.0
    description: Ambient temperature during measurement in Celsius

files:
  - name: session_manifest_csv
    filename_pattern: "session_manifest.csv"
    file_format: csv
    required: true
    description: >
      CSV with columns: lane_id (fwd_3g|fwd_6g|rev_187m), channel
      (forward|reverse), rate_gbps, eye_csv, margin_csv. Exactly one row per
      lane (3 rows total).

  - name: eye_grid_files
    filename_pattern: "eye_*.csv"
    file_format: csv
    required: true
    description: >
      One raw eye-monitor grid CSV per lane with columns: phase (0-127),
      vth (0-63), polarity (0|1), hits, errors (-1 flags a measurement
      timeout). One row per measured (phase, vth, polarity) point.

  - name: link_margin_files
    filename_pattern: "margin_*.csv"
    file_format: csv
    required: true
    description: >
      One raw link-margin CSV per lane with columns: tx_amp_mv, code, rep,
      locked, errors (-1 if lock was lost), status (ok|errors|lost_lock|
      ser_unreachable). Final per-point values; variability comes from
      repeated sessions.

processing_steps:
  - name: process_serdes
    processor: src.processing.serdes.ProcessSerdes
    description: Compute eye-opening and link-margin metrics per lane
    outputs: ["serdes_metrics_csv", "serdes_summary_json"]

aggregation:
  - name: serdes_summary
    aggregator: src.aggregation.serdes.SerdesSummary
    description: Aggregate SerDes metrics across sessions vs cable length
    outputs:
      [
        "serdes_metrics_table",
        "serdes_eye_vs_length_plot",
        "serdes_margin_vs_length_plot",
      ]
